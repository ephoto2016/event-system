<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="fonts/heebo.css">
<style>
  :root {
    --bg:#0b1120; --text:#f8fafc; --muted:#94a3b8;
    --green:#10b981; --sky:#38bdf8; --purple:#c084fc; --red:#ef4444;
    --u: 1vw;               /* base unit: 1% of width (horizontal) */
  }
  html.v { --u: 1.78vw; }   /* vertical 9:16: scale type up so it reads on a phone */
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:'Heebo',sans-serif; color:var(--text); position:relative; }
  #bg { position:absolute; inset:0;
        background:
          radial-gradient(60% 50% at 80% 10%, rgba(56,189,248,.18), transparent 70%),
          radial-gradient(60% 50% at 15% 95%, rgba(16,185,129,.16), transparent 70%),
          var(--bg); }
  #noise { position:absolute; inset:0; width:100%; height:100%; opacity:0; }
  .stage { position:absolute; inset:0; display:flex; flex-direction:column;
           align-items:center; justify-content:center; text-align:center; padding:0 8%; gap:calc(var(--u)*1.2); }
  .item { position:absolute; left:8%; right:8%; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center; gap:calc(var(--u)*1.2); opacity:0; }
  .big   { font-weight:900; font-size:calc(var(--u)*7.2); line-height:1.12; letter-spacing:-.01em; }
  .mid   { font-weight:800; font-size:calc(var(--u)*4.4); line-height:1.2; }
  .small { font-weight:500; font-size:calc(var(--u)*2.6); color:var(--muted); }
  .grad  { background:linear-gradient(135deg,#38bdf8,#10b981); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .red   { color:var(--red); } .green { color:var(--green); } .purple{ color:var(--purple); } .sky{ color:var(--sky); }
  .rule  { width:calc(var(--u)*9); height:calc(var(--u)*.5); border-radius:9px; background:linear-gradient(90deg,#38bdf8,#10b981); }
  .quote::before { content:"״"; } .quote::after { content:"״"; }
  .quote { font-weight:800; font-size:calc(var(--u)*5.4); line-height:1.2; }
  .badge { font-weight:800; font-size:calc(var(--u)*2.3); color:var(--green); border:2px solid var(--green);
           padding:calc(var(--u)*.5) calc(var(--u)*2); border-radius:99px; background:rgba(16,185,129,.12); }
  /* lower-third label drawn over clips */
  .label { position:absolute; display:flex; align-items:center; gap:calc(var(--u)*1.2);
           font-weight:800; font-size:calc(var(--u)*2.1); padding:calc(var(--u)*.8) calc(var(--u)*1.8);
           background:rgba(11,17,32,.82); border-radius:calc(var(--u)*1.2); border-right:calc(var(--u)*.5) solid var(--c); }
  .label .dot { width:calc(var(--u)*1.2); height:calc(var(--u)*1.2); border-radius:50%; background:var(--c); }
  html.h .label { top:3.2vw; left:3vw; }
  html.v .label { top:44vw; left:50%; transform:translateX(-50%); max-width:92vw; width:max-content; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="noise" width="480" height="270"></canvas>
<div id="root"></div>
<script>
const CARDS = {
  intro: { dur:3, items:[
    { s:0.1, e:2.9, html:`<div class="badge">מחלקת קשר 951</div>
        <div class="big grad">מערך הלמידה</div><div class="rule"></div>
        <div class="mid">מבית מחלקת קשר 951</div>` } ]},
  stigma: { dur:6, noise:true, items:[
    { s:0.0, e:2.0, html:`<div class="quote red">הקשר לא עובד</div>` },
    { s:2.0, e:4.0, html:`<div class="quote red">אני אף פעם לא שומע את החמ"ל טוב</div>` },
    { s:4.0, e:6.0, html:`<div class="quote red">אנחנו אחד ליד השני ולא שומעים כלום</div>` } ]},
  reveal: { dur:5, items:[
    { s:0.0, e:2.3, html:`<div class="big">זה לא הקשר.</div>` },
    { s:2.3, e:5.0, html:`<div class="mid grad" style="font-size:calc(var(--u)*5.2)">זה חוסר הבנה של המכשיר</div>
                          <div class="mid">ושל צורת העבודה שלו</div>` } ]},
  close: { dur:9, items:[
    { s:0.0, e:3.0, html:`<div class="small">ליונט</div><div class="big purple">המצאת המאה.</div>` },
    { s:3.0, e:6.0, html:`<div class="big red">וגם האסון של הקו.</div>` },
    { s:6.0, e:9.0, html:`<div class="mid grad" style="font-size:calc(var(--u)*5.4)">תדע מתי לעבור לקשר</div>
                          <div class="rule"></div><div class="small">מערך הלמידה · מחלקת קשר 951</div>`, keep:true } ]},
};
const LABELS = {
  lionet: { c:'var(--purple)', t:'ליונט · תלוי בקליטה סלולרית ובאתר מגושר' },
  tac1:   { c:'var(--green)',  t:'קשר טקטי (תג"מ) · מאנטנת מכשיר לאנטנת מכשיר' },
  tac2:   { c:'var(--green)',  t:'קשר טקטי (תג"מ) · תלוי תוואי שטח' },
  roip1:  { c:'var(--sky)',    t:'RoIP · סמב"צית בחמ"ל מנתבת ידנית בין אתרים' },
  roip2:  { c:'var(--sky)',    t:'RoIP · בחירת אתר = בחירה עם מי מדברים' },
};
const q = new URLSearchParams(location.search);
const card = q.get('card'), fmt = q.get('fmt') || 'h', label = q.get('label');
document.documentElement.classList.add(fmt);
const root = document.getElementById('root');
const ease = x => 1 - Math.pow(1 - x, 3);
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
const nz = document.getElementById('noise'), nctx = nz.getContext('2d');
let els = [];
if (label) {
  document.getElementById('bg').style.display='none';
  document.body.style.background='transparent'; document.documentElement.style.background='transparent';
  const L = LABELS[label];
  const d = document.createElement('div'); d.className='label'; d.style.setProperty('--c', L.c);
  d.innerHTML = `<span class="dot"></span><span>${L.t}</span>`; root.appendChild(d);
} else {
  for (const it of CARDS[card].items) {
    const d = document.createElement('div'); d.className = 'item'; d.innerHTML = it.html; root.appendChild(d); els.push([d, it]);
  }
}
window.at = function(t, frame) {
  for (const [d, it] of els) {
    const IN = .35, OUT = it.keep ? 0 : .3;
    let o = 0, y = 0;
    if (t >= it.s && t <= it.e) {
      const a = Math.min(1, (t - it.s) / IN);
      const b = OUT ? Math.min(1, (it.e - t) / OUT) : 1;
      o = ease(a) * ease(b); y = (1 - ease(a)) * 24;
    }
    d.style.opacity = o; d.style.transform = `translateY(${y}px)`;
  }
  if (card && CARDS[card].noise) {
    const r = rng(frame * 7919 + 13), img = nctx.createImageData(480, 270);
    for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
    nctx.putImageData(img, 0, 0);
    const pulse = .10 + .05 * Math.sin(t * 9) + (Math.floor(t * 2) % 2 === 0 && (t * 2 % 1) < .12 ? .12 : 0);
    nz.style.opacity = pulse;
  }
};
window.DUR = card ? CARDS[card].dur : 0;
window.at(0, 0);
</script>
</body>
</html>
